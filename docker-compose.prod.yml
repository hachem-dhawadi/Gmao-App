services:

  # ─────────────────────────────────────────────────────────
  # MySQL 8 — same as dev, data persisted in named volume
  # ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: gmao_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-gmao}
      MYSQL_USER: ${DB_USERNAME:-gmao_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gmao_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Laravel PHP-FPM — pulled from GitHub Container Registry
  # ─────────────────────────────────────────────────────────
  php:
    image: ghcr.io/${GITHUB_OWNER}/gmao-backend:${IMAGE_TAG:-latest}
    container_name: gmao_php
    restart: always
    environment:
      APP_NAME: GMAO
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${SERVER_IP}:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gmao}
      DB_USERNAME: ${DB_USERNAME:-gmao_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      GROQ_API_KEY: ${GROQ_API_KEY}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: gmao-app
      REVERB_APP_KEY: gmao-reverb-key
      REVERB_APP_SECRET: gmao-reverb-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_MAILER: log
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gmao_net

  # ─────────────────────────────────────────────────────────
  # Laravel Queue Worker
  # ─────────────────────────────────────────────────────────
  queue:
    image: ghcr.io/${GITHUB_OWNER}/gmao-backend:${IMAGE_TAG:-latest}
    container_name: gmao_queue
    restart: always
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gmao}
      DB_USERNAME: ${DB_USERNAME:-gmao_user}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      GROQ_API_KEY: ${GROQ_API_KEY}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: gmao-app
      REVERB_APP_KEY: gmao-reverb-key
      REVERB_APP_SECRET: gmao-reverb-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_MAILER: log
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - gmao_net

  # ─────────────────────────────────────────────────────────
  # Laravel Reverb — WebSocket server (public port 8080)
  # ─────────────────────────────────────────────────────────
  reverb:
    image: ghcr.io/${GITHUB_OWNER}/gmao-backend:${IMAGE_TAG:-latest}
    container_name: gmao_reverb
    restart: always
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gmao}
      DB_USERNAME: ${DB_USERNAME:-gmao_user}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: gmao-app
      REVERB_APP_KEY: gmao-reverb-key
      REVERB_APP_SECRET: gmao-reverb-secret
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_MAILER: log
    volumes:
      - storage_app:/var/www/html/storage/app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - gmao_net

  # ─────────────────────────────────────────────────────────
  # Nginx — Laravel API reverse proxy (port 8000)
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: gmao_nginx
    restart: always
    volumes:
      - ./backend/gmao/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/gmao/public:/var/www/html/public:ro
      - storage_app:/var/www/html/storage/app:ro
    ports:
      - "8000:80"
    depends_on:
      - php
    networks:
      - gmao_net

  # ─────────────────────────────────────────────────────────
  # React Frontend — production bundle served by Nginx (port 80)
  # ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_OWNER}/gmao-frontend:${IMAGE_TAG:-latest}
    container_name: gmao_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - nginx
    networks:
      - gmao_net

volumes:
  db_data:
    driver: local
  storage_app:
    driver: local

networks:
  gmao_net:
    driver: bridge
