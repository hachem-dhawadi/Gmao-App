name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gmao-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gmao-frontend

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build Docker images and push to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image (PHP 8.4 + Laravel) ───────
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/gmao
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Frontend image (Node build → Nginx) ─────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: "./frontweb/Ecme - React Tailwind Admin Template/starter"
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_BACKEND_URL=http://${{ secrets.AZURE_VM_IP }}:8000
            VITE_REVERB_APP_KEY=gmao-reverb-key
            VITE_REVERB_HOST=${{ secrets.AZURE_VM_IP }}
            VITE_REVERB_PORT=8080
            VITE_REVERB_SCHEME=http
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ──────────────────────────────────────────────
  # Job 2: Deploy to Azure VM via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR,IMAGE_TAG,REPO_OWNER
          timeout: 120s
          script: |
            set -e

            echo "==> Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "==> Pulling latest images..."
            cd /opt/gmao
            git pull origin main

            # Update .env with latest image tag
            sed -i "s|IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            sed -i "s|GITHUB_OWNER=.*|GITHUB_OWNER=$REPO_OWNER|" .env

            echo "==> Deploying containers..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Cleaning old images..."
            docker image prune -f

            echo "==> Running migrations..."
            docker exec gmao_php php artisan migrate --force

            echo ""
            echo "✅ Deploy complete at $(date)"
            echo "   Frontend: http://$(curl -s ifconfig.me)"
            echo "   API:      http://$(curl -s ifconfig.me):8000"
