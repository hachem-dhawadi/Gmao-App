server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy /api to backend nginx
    location /api {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 55M;
    }

    # Proxy /storage to backend nginx
    # ^~ prevents the static-assets regex from matching /storage/chat/1/image.jpg
    location ^~ /storage {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
    }

    # Never cache index.html — it holds the hashed asset references
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA — serve existing files directly, everything else → index.html
    # Do NOT use $uri/ — the /assets/ directory exists on disk and would
    # trigger a 301 redirect to http://localhost/assets/ (dropping the port),
    # which lands on WampServer instead of Docker.
    location / {
        try_files $uri /index.html;
    }
}
